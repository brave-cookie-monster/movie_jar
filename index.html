<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Jar - Movie Night Decision Picker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: { 850: '#643714' },
                        cinema: {
                            gold: '#f59e0b',
                            red: '#e11d48',
                            dark: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- Optional Client Environment Config -->
    <script src="env.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-300">

    <!-- Header / Navbar -->
    <header class="w-full border-b border-slate-200/80 dark:border-slate-800/80 glass-panel sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-rose-500 text-white flex items-center justify-center text-xl shadow-md">
                    <i class="fa-solid fa-clapperboard"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg leading-tight tracking-tight flex items-center gap-2">
                        <span>Movie Jar</span>
                        <span class="text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20">Cinema</span>
                    </h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Movie night selection & agreed rotation</p>
                </div>
            </div>

            <!-- Current Turn & Controls -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- Turn Indicator Pill -->
                <div id="currentTurnBadge" class="hidden sm:block"></div>

                <!-- Sound Toggle -->
                <button id="soundToggleBtn" class="p-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800 transition" title="Toggle Sound">
                    <i class="fa-solid fa-volume-high text-base" id="soundIcon"></i>
                </button>

                <!-- Theme Toggle -->
                <button id="themeToggleBtn" class="p-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800 transition" title="Toggle Dark/Light Mode">
                    <i class="fa-solid fa-moon text-base" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Left Panel: Rotation Flow & Movie Management -->
        <section class="lg:col-span-6 xl:col-span-5 flex flex-col space-y-5 order-2 lg:order-1">
            
            <!-- Agreed Rotation Stepper -->
            <div class="glass-panel rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-arrows-rotate text-amber-500"></i>
                        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">Agreed Movie Rotation</h2>
                    </div>
                    <button id="advanceRotationBtn" class="text-xs text-amber-600 dark:text-amber-400 hover:underline font-semibold flex items-center gap-1">
                        <span>Next Turn</span>
                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </button>
                </div>
                <!-- 3 Steps: 1. My Movie, 2. Her Movie, 3. Rewatches -->
                <div id="rotationStepsContainer" class="flex gap-2">
                    <!-- Populated dynamically by app.js -->
                </div>
            </div>

            <!-- Add Movie Form Card -->
            <div class="glass-panel rounded-2xl p-5 shadow-sm flex flex-col space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="font-bold text-base flex items-center gap-2">
                        <i class="fa-solid fa-film text-amber-500"></i>
                        <span>Add New Movie</span>
                    </h2>
                    <button id="toggleBulkBtn" class="text-xs text-slate-500 hover:text-amber-500 transition flex items-center gap-1">
                        <i class="fa-solid fa-layer-group"></i> Bulk Add
                    </button>
                </div>

                <!-- Add Form -->
                <form id="addMovieForm" class="space-y-3">
                    <div>
                        <input type="text" id="movieTitleInput" placeholder="Movie title (e.g. Interstellar)..." 
                               class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 dark:focus:ring-amber-400 transition" required>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <!-- Category Selector (Agreed rotation slot) -->
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Rotation Category</label>
                            <select id="movieCategorySelect" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-2.5 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                                <option value="mine">👤 My Movie</option>
                                <option value="hers">💃 Her Movie</option>
                                <option value="rewatch" selected>🔁 Rewatch (Both)</option>
                            </select>
                        </div>

                        <!-- Genre Selector -->
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Genre</label>
                            <select id="movieGenreSelect" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-2.5 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                                <!-- Populated dynamically from CONFIG.genres -->
                            </select>
                        </div>
                    </div>

                    <!-- Custom genre optional input -->
                    <div>
                        <input type="text" id="customGenreInput" placeholder="Or type custom genre (optional)..." 
                               class="w-full bg-white/60 dark:bg-slate-900/60 border border-slate-300/80 dark:border-slate-700/80 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                    </div>

                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-98 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-md shadow-amber-500/20 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>Drop Slip into Movie Jar</span>
                    </button>
                </form>

                <!-- Bulk Add Drawer -->
                <div id="bulkContainer" class="hidden pt-2 border-t border-slate-200 dark:border-slate-800 space-y-2">
                    <p class="text-xs text-slate-500">Paste movie titles (one per line):</p>
                    <textarea id="bulkInput" rows="3" placeholder="Inception&#10;Dune&#10;Blade Runner" 
                              class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-amber-500 transition"></textarea>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <select id="bulkCategorySelect" class="bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-2 py-1.5 text-xs">
                            <option value="mine">👤 My Movie</option>
                            <option value="hers">💃 Her Movie</option>
                            <option value="rewatch" selected>🔁 Rewatch (Both)</option>
                        </select>
                        <select id="bulkGenreSelect" class="bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-2 py-1.5 text-xs">
                            <option value="Drama">Drama</option>
                            <option value="Sci-Fi">Sci-Fi</option>
                            <option value="Comedy">Comedy</option>
                            <option value="Romance">Romance</option>
                            <option value="Thriller">Thriller</option>
                            <option value="Horror">Horror</option>
                            <option value="Animation">Animation</option>
                            <option value="Action">Action</option>
                        </select>
                    </div>

                    <button id="addBulkBtn" class="w-full bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 text-white text-xs font-semibold py-2 rounded-xl transition">
                        Add All Movies
                    </button>
                </div>
            </div>

            <!-- Movies List & Filter Panel -->
            <div class="glass-panel rounded-2xl p-5 shadow-sm flex flex-col space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="font-bold text-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-list-ul text-amber-500"></i>
                        <span>Movies in Rotation</span>
                        <span id="totalMoviesCount" class="text-xs bg-amber-100 dark:bg-amber-950/80 text-amber-700 dark:text-amber-300 px-2 py-0.5 rounded-full font-bold">0</span>
                    </h3>

                    <!-- Watched Toggle -->
                    <label class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="hideWatchedCheckbox" checked class="rounded border-slate-300 dark:border-slate-700 text-amber-500 focus:ring-amber-400">
                        <span>Hide watched</span>
                    </label>
                </div>

                <!-- Category Filter Tabs -->
                <div class="flex gap-1.5 overflow-x-auto pb-1" id="categoryTabsContainer">
                    <!-- Populated dynamically -->
                </div>

                <!-- Genre & Search Filter Bar -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" id="searchInput" placeholder="Search title..." 
                               class="w-full pl-8 pr-3 py-1.5 bg-white/70 dark:bg-slate-900/70 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                    </div>
                    <div>
                        <select id="genreFilterSelect" class="w-full bg-white/70 dark:bg-slate-900/70 border border-slate-200 dark:border-slate-700 rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                            <option value="all">All Genres</option>
                        </select>
                    </div>
                </div>

                <!-- Movies Scrollable List -->
                <div id="moviesList" class="max-h-60 overflow-y-auto space-y-1.5 pr-1 pt-1">
                    <!-- Rendered dynamically -->
                </div>
            </div>

            <!-- Drawn History -->
            <div class="glass-panel rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Recently Picked</span>
                    <button id="clearHistoryBtn" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">Reset</button>
                </div>
                <div id="historyList" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto pt-1">
                    <span class="text-xs text-slate-400 italic">No movies drawn yet.</span>
                </div>
            </div>

        </section>

        <!-- Right Panel: Interactive Movie Jar & Draw Actions -->
        <section class="lg:col-span-6 xl:col-span-7 flex flex-col items-center justify-center space-y-6 order-1 lg:order-2 py-4">
            
            <!-- Visual Glass Jar Container -->
            <div class="relative w-full max-w-sm aspect-[4/5] flex items-center justify-center group cursor-pointer" id="jarClickArea" title="Click or tap to shake and draw!">
                <!-- Ambient Cinema Lighting Glow -->
                <div class="absolute inset-0 ambient-glow blur-3xl rounded-full -z-10 opacity-75 dark:opacity-60 pointer-events-none"></div>
                
                <!-- The Canvas element rendered by js/modules/jar.js -->
                <canvas id="jarCanvas" class="w-full h-full object-contain filter drop-shadow-2xl transition-transform duration-200 active:scale-95"></canvas>
                
                <!-- Helper overlay tooltip -->
                <div class="absolute bottom-2 bg-slate-900/80 dark:bg-slate-800/90 text-white text-xs px-3.5 py-1.5 rounded-full backdrop-blur-md opacity-80 group-hover:opacity-100 transition shadow-lg pointer-events-none flex items-center gap-1.5">
                    <i class="fa-solid fa-hand-pointer text-amber-400 text-xs"></i>
                    <span>Tap jar to rustle & draw</span>
                </div>
            </div>

            <!-- Draw Controls -->
            <div class="flex flex-col items-center space-y-3 w-full max-w-xs">
                <!-- Status subtext -->
                <p id="jarSubtext" class="text-xs text-slate-500 dark:text-slate-400 text-center font-medium">
                    Following Rotation: My Movie
                </p>

                <!-- Primary Draw Button -->
                <button id="drawBtn" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-amber-500 via-amber-600 to-rose-600 hover:from-amber-600 hover:to-rose-700 active:scale-95 text-white font-extrabold text-lg shadow-xl shadow-amber-500/25 transition transform flex items-center justify-center space-x-3">
                    <i class="fa-solid fa-ticket text-xl"></i>
                    <span>Draw Movie Slip</span>
                </button>

                <!-- Secondary Actions -->
                <div class="flex items-center justify-between w-full text-xs text-slate-500 dark:text-slate-400 px-2">
                    <div class="flex items-center gap-1.5">
                        <i class="fa-solid fa-box-archive text-amber-500 text-xs"></i>
                        <span>Slips in Jar:</span>
                        <strong id="jarCountBadge" class="text-slate-800 dark:text-slate-200">0</strong>
                    </div>
                    <button id="shakeBtn" class="hover:text-amber-500 dark:hover:text-amber-400 transition font-medium flex items-center gap-1">
                        <i class="fa-solid fa-sync"></i> Shake Jar
                    </button>
                </div>
            </div>

        </section>
    </main>

    <!-- Drawn Result Modal (Movie Ticket Unfolded Style) -->
    <div id="resultModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modalCard" class="relative w-full max-w-md bg-amber-50 dark:bg-slate-900 border-2 border-amber-300/80 dark:border-amber-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl text-center transform scale-90 transition-all duration-300">
            
            <!-- Movie Ticket Header -->
            <div class="flex items-center justify-between pb-3 border-b border-amber-200/80 dark:border-slate-800">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-clapperboard text-amber-500 text-lg"></i>
                    <span class="text-xs uppercase tracking-widest font-extrabold text-slate-500 dark:text-slate-400">Admit One • Movie Night</span>
                </div>
                <span id="resultGenreBadge" class="text-xs px-2.5 py-0.5 rounded-full font-bold bg-amber-500/10 text-amber-700 dark:text-amber-400 border border-amber-500/20">Genre</span>
            </div>

            <!-- Category badge -->
            <div id="resultCategoryBadge" class="mt-4 flex justify-center">
                <!-- Badge injected dynamically -->
            </div>
            
            <!-- Movie Title with Handwritten / Cinema Display Font -->
            <div class="my-5 p-6 rounded-2xl bg-white dark:bg-slate-800 shadow-inner border border-amber-100 dark:border-slate-700/60 min-h-[110px] flex items-center justify-center">
                <h3 id="resultMovieTitle" class="handwritten text-3xl sm:text-4xl text-slate-900 dark:text-amber-100 font-bold leading-relaxed break-words max-w-full">
                    -
                </h3>
            </div>

            <!-- Modal Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-2.5 justify-center">
                <button id="drawAgainBtn" class="px-4 py-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-semibold text-xs transition">
                    Draw Another
                </button>
                <button id="closeModalBtn" class="px-4 py-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-semibold text-xs transition">
                    Keep in Jar
                </button>
                <button id="confirmWatchBtn" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-rose-600 hover:from-amber-600 hover:to-rose-700 text-white font-bold text-xs shadow-md shadow-amber-500/20 transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>Watch & Next Turn</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Application Script (ES Module) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
